<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en" data-bs-theme="dark">
<head th:replace="~{fragments :: head('Search')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container pb-5">
    <div th:replace="~{fragments :: flash}"></div>

    <section class="hero">
        <h1>Rent a car in minutes</h1>
        <p class="hint mb-0">Sedan, SUV or Van. Free cancellation before pick-up. Pay at the desk.</p>
    </section>

    <form class="card card-body mb-4" method="get" th:action="@{/}">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="start" class="form-label">Pick-up date and time</label>
                <input type="datetime-local" class="form-control" id="start" name="start" required
                       th:value="${startValue}">
            </div>
            <div class="col-md-3">
                <label for="days" class="form-label">Days</label>
                <input type="number" class="form-control" id="days" name="days" min="1" max="30" required
                       th:value="${days}">
            </div>
            <div class="col-md-4 d-grid">
                <button type="submit" class="btn btn-accent">Search</button>
            </div>
        </div>
    </form>

    <div class="card" th:if="${results != null}">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Car type</th>
                    <th>Daily rate</th>
                    <th>Availability</th>
                    <th>Total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${results}">
                    <td><strong th:text="${r.type.label}">Sedan</strong></td>
                    <td th:text="${#numbers.formatDecimal(r.type.dailyRate, 1, 2) + ' € / day'}">40.00 € / day</td>
                    <td>
                        <span class="badge"
                              th:classappend="${r.available > 0} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${r.available > 0 ? r.available + ' of ' + r.capacity + ' free' : 'Sold out'}">free</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(r.totalPrice, 1, 2) + ' €'}">120.00 €</td>
                    <td class="text-end">
                        <th:block th:if="${r.available > 0}">
                            <form sec:authorize="isAuthenticated()" th:action="@{/bookings}" method="post" class="m-0">
                                <input type="hidden" name="type" th:value="${r.type}">
                                <input type="hidden" name="start" th:value="${startValue}">
                                <input type="hidden" name="days" th:value="${days}">
                                <button type="submit" class="btn btn-accent btn-sm">Book</button>
                            </form>
                            <a sec:authorize="isAnonymous()" th:href="@{/login}"
                               class="btn btn-outline-secondary btn-sm">Log in to book</a>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="hint mt-3" th:if="${results != null}">
        Availability means a car of that type is free for the whole period.
    </p>
</main>

<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
