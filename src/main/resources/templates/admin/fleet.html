<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments :: head('Fleet')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container pb-5">
    <h1 class="h3 mb-4">Fleet</h1>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4" th:each="row : ${summary}">
            <div class="card card-body">
                <div class="hint" th:text="${row.type.label}">Sedan</div>
                <div class="display-6" th:text="${row.cars}">3</div>
                <div class="hint">cars (capacity)</div>
            </div>
        </div>
    </div>

    <form class="card card-body mb-4" th:action="@{/admin/fleet/cars}" method="post">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="plate" class="form-label">Plate</label>
                <input type="text" class="form-control" id="plate" name="plate" maxlength="16" required>
            </div>
            <div class="col-md-4">
                <label for="type" class="form-label">Type</label>
                <select class="form-select" id="type" name="type">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}">Sedan</option>
                </select>
            </div>
            <div class="col-md-3 d-grid">
                <button type="submit" class="btn btn-accent">Add car</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Plate</th>
                    <th>Type</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${cars}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.plate}">SED-101</td>
                    <td th:text="${c.type.label}">Sedan</td>
                    <td class="text-end">
                        <form th:action="@{/admin/fleet/cars/{id}/delete(id=${c.id})}" method="post" class="m-0"
                              onsubmit="return confirm('Remove this car from the fleet?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="hint mt-3">
        A car cannot be removed while existing reservations still need it.
    </p>
</main>

<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
